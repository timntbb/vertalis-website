  <g fill="#e7e7e7" font-family="Georgia, serif" font-size="20">
    <text x="476" y="418">Lower initial formation cost</text>
    <text x="476" y="474">Centralized, but still requires</text><text x="476" y="500">clean separation</text>
    <text x="476" y="542">Strong if each series is properly</text><text x="476" y="568">maintained</text>
    <text x="476" y="618">Sometimes less familiar</text>
    <text x="476" y="674">Possible, but the structure can be</text><text x="476" y="700">more nuanced</text>
