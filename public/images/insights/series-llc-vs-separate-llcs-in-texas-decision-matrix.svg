    <text x="476" y="792">Multiple similar Texas assets</text><text x="476" y="818">with simple ownership</text>

    <text x="968" y="418">Higher if each property gets its own LLC</text>
    <text x="968" y="474">More filings and more entity</text><text x="968" y="500">maintenance</text>
    <text x="968" y="542">Strong and more familiar to</text><text x="968" y="568">third parties</text>
    <text x="968" y="606">Usually easier for third parties</text><text x="968" y="632">to understand</text>
    <text x="968" y="674">Often cleaner and more</text><text x="968" y="700">straightforward</text>
    <text x="968" y="750">More predictable across states</text>
    <text x="968" y="792">Complex financing, different investors,</text><text x="968" y="818">or multi-state operations</text>
